name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest ships ANDROID_HOME=/usr/local/lib/android/sdk with
      # android-36 and build-tools 36.0.0 preinstalled; nothing to install.
      # NOTE: sdkmanager is NOT on PATH here — use $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager if ever needed.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Builds the minified release variant without signing secrets;
      # build.gradle.kts falls back to the debug key in that case.
      - name: Assemble release (minified)
        run: ./gradlew assembleRelease
